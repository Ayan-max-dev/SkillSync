{% extends "base.html" %}
{% block title %}Edit Profile — SkillShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title mb-1 fw-bold">Edit your profile</h3>
                <p class="text-muted mb-4">This info is shown to others when you teach or attend sessions.</p>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Grade</label>
                        <input type="text" name="grade" class="form-control" value="{{ current_user.grade or '' }}" placeholder="e.g. 11th Grade" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Courses completed</label>
                        <textarea name="courses_completed" class="form-control" rows="2" placeholder="e.g. AP Bio, Algebra II, Spanish 3" required>{{ current_user.courses_completed or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio (optional)</label>
                        <textarea name="bio" class="form-control" rows="3" placeholder="A little about yourself">{{ current_user.bio or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
