{% extends "base.html" %}
{% block title %}All Users — SkillSync{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4">All Users</h2>
<div class="list-group">
    {% for user in users %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ user.name }}</span>
            <span class="text-muted">{{ user.email }}</span>
        </div>
    {% else %}
        <p class="text-muted">No users yet — be the first to sign up!</p>
    {% endfor %}
</div>
{% endblock %}
