{% extends "base.html" %}
{% block title %}Post a Request — SkillSync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title mb-1 fw-bold">Request to learn a skill</h3>
                <p class="text-muted mb-4">Ask the community to teach you something.</p>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-warning">{{ messages[0] }}</div>
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Skill name</label>
                        <input type="text" name="skill_name" id="skill_name_input" class="form-control" placeholder="e.g. Rubik's Cube, Calculus" required autocomplete="off">
                        <div id="similar-requests" class="mt-2"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            {% for category in ["Technology & Computing", "Mathematics", "Science", "Languages", "Music", "Art & Design", "Communication & Public Speaking", "Writing & Literature", "Sports & Fitness", "Business & Entrepreneurship", "Academic Skills & Study Techniques", "Life Skills", "Other", "Academic", "Non-academic"] %}
                            <option value="{{ category }}">{{ category }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="What specifically do you want to learn?"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preferred time</label>
                        <input type="text" name="preferred_time" class="form-control" placeholder="e.g. weekday afternoons, weekends">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Post Request</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const input = document.getElementById("skill_name_input");
const resultsBox = document.getElementById("similar-requests");
let debounceTimer;

input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const query = input.value.trim();

    if (query.length < 2) {
        resultsBox.innerHTML = "";
        return;
    }

    // Wait 300ms after the user stops typing before searching,
    // so we're not hitting the server on every single keystroke
    debounceTimer = setTimeout(() => {
        fetch(`/requests/search-similar?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    resultsBox.innerHTML = "";
                    return;
                }
                resultsBox.innerHTML = `
                    <div class="alert alert-info p-2">
                        <small class="fw-bold">Similar open requests already exist:</small>
                        <ul class="mb-0 mt-1 small">
                            ${data.map(r => `
                                <li>
                                    ${r.skill_name} — requested by ${r.student_name}
                                    (${r.upvote_count} upvote${r.upvote_count === 1 ? '' : 's'})
                                    — <a href="/explore">upvote it instead</a>
                                </li>
                            `).join("")}
                        </ul>
                    </div>
                `;
            });
    }, 300);
});
</script>

{% endblock %}
